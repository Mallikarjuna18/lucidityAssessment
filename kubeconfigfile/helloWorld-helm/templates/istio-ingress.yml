apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.istio.gatewayName }}
  namespace: {{ .Values.istio.gatewayNamespace }}

spec:

  selector:
    istio: ingress

  servers:

  - port:

      number: 80

      name: http

      protocol: HTTP

    hosts:

    - "*"
---
apiVersion: networking.istio.io/v1

kind: VirtualService

metadata:
  name: {{ include "myapp.fullname" . }}
  namespace: {{ .Values.istio.gatewayNamespace }}

spec:

  hosts:
  - "*"

  gateways:
  - {{ .Values.istio.gatewayName }}

  http:

  - match:

    - uri:

        prefix: /hello

    rewrite:

      uri: /

    route:

    - destination:
        host: "{{ include "myapp.fullname" . }}.{{ .Values.namespace }}.svc.cluster.local"
        port:
          number: 80